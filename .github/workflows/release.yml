name: Release
run-name: Release to ${{ inputs.environment || 'staging' }} by @${{ github.actor }}

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run deployment in"
        type: environment
        required: true
        default: production

env:
  NODE_AUTH_TOKEN: ${{ secrets.STACKLA_BOT_GITHUB_TOKEN }}

jobs:
  release:
    concurrency:
      group: releases
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.STACKLA_BOT_GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
      - name: Configure AWS credentials
        uses: Stackla/stackla-github-actions/aws@stable
        with:
          aws-region: ${{ vars.AWS_REGION }}
      - name: Release static files to CDN
        run: |
          aws s3 sync dist/ s3://ugc-nextgen-widgets-ap-southeast-2/templates/utils/${{ inputs.environment }}/ --delete
      - name: Version & publish
        run: |
          npx changeset version
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changesets found, nothing to release"
            exit 0
          fi
          git config user.name "$(gh api user --jq '.name // .login')"
          git config user.email "$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')"
          git add .
          git commit -m "chore: release [skip ci]"
          git push origin master
          npm publish --registry=https://registry.npmjs.org/
          npm publish --registry=https://npm.pkg.github.com/
        env:
          GH_TOKEN: ${{ secrets.STACKLA_BOT_GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.STACKLA_BOT_GITHUB_TOKEN }}
