name: "AWS Configure"
inputs:
  aws-region:
    required: true
    description: "The AWS region used to authenticate with AWS"
runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      id: configure-aws
      uses: Stackla/stackla-github-actions/aws@stable
      with:
        aws-region: ${{ vars.AWS_REGION }}
